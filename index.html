<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora IMC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%);
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(100%, 430px);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #2563eb);
            color: #fff;
            border-bottom: none;
            border-radius: 20px 20px 0 0 !important;
            padding: 1.25rem 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .resultado {
            display: none;
            margin-top: 1rem;
            border-radius: 12px;
            font-weight: 600;
        }

        .resultado.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h1 class="h3 mb-0">Calculadora de IMC</h1>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="altura" class="form-label">Altura (m)</label>
                            <input type="number" id="altura" class="form-control" min="0.5" step="0.01" placeholder="Ex.: 1.75" />
                        </div>

                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <input type="number" id="peso" class="form-control" min="1" step="0.1" placeholder="Ex.: 70.5" />
                        </div>

                        <button id="calcular" class="btn btn-primary w-100">Calcular</button>

                        <div id="resultado" class="resultado alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const calcular = document.getElementById("calcular");
        const resultado = document.getElementById("resultado");

        calcular.addEventListener("click", () => {
            const altura = Number(document.getElementById("altura").value);
            const peso = Number(document.getElementById("peso").value);

            if (!altura || !peso || altura <= 0 || peso <= 0) {
                resultado.className = "resultado visible alert alert-danger";
                resultado.textContent = "Informe valores válidos de altura e peso.";
                return;
            }

            const imc = peso / (altura * altura);
            let situacao = "";

            if (imc < 17) {
                situacao = "Muito abaixo do peso";
            } else if (imc >= 17 && imc <= 18.49) {
                situacao = "Abaixo do peso";
            } else if (imc >= 18.5 && imc <= 24.99) {
                situacao = "Peso normal";
            } else if (imc >= 25 && imc <= 29.99) {
                situacao = "Sobrepeso";
            } else if (imc >= 30 && imc <= 34.99) {
                situacao = "Obesidade I";
            } else if (imc >= 35 && imc <= 39.99) {
                situacao = "Obesidade II";
            } else {
                situacao = "Obesidade III";
            }

            resultado.className = "resultado visible alert alert-info";
            resultado.innerHTML = `<strong>IMC:</strong> ${imc.toFixed(2)}<br><strong>Situação:</strong> ${situacao}`;
        });
    </script>
</body>
</html>
