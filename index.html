<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora IMC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h1 class="h3 mb-0">Calculadora de IMC</h1>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="altura" class="form-label">Altura (m)</label>
                            <input type="text" id="altura" class="form-control" inputmode="decimal" placeholder="Ex.: 1.75" />
                        </div>

                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <input type="text" id="peso" class="form-control" inputmode="decimal" placeholder="Ex.: 70.5" />
                        </div>

                        <button id="calcular" class="btn btn-primary w-100">Calcular</button>

                        <div id="resultado" class="resultado alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
